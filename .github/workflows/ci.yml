name: CI

# Phase 9 pipeline from the architecture doc: Code Quality -> Unit Tests -> Security Scan ->
# Docker Build. Runs on every PR and on pushes to main; CD (cd.yml) picks up from here and
# only runs after this workflow succeeds on main.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      # Neither workspace ships an eslint config yet — this stays non-fatal until one lands,
      # rather than blocking every PR on a step that can't currently pass.
      - run: npm run lint --workspaces --if-present
        continue-on-error: true

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: streamflix
          POSTGRES_PASSWORD: streamflix_local_pw
          POSTGRES_DB: streamflix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streamflix -d streamflix"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports: ["8000:8000"]
    env:
      DATABASE_URL: postgres://streamflix:streamflix_local_pw@localhost:5432/streamflix
      REDIS_URL: redis://localhost:6379
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - name: Migrate + seed test database
        working-directory: backend
        run: npm run setup
      - name: Run backend test suite
        working-directory: backend
        run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.streamflix.com/api/v1
          VITE_APP_NAME: StreamFlix
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker-build-scan:
    name: Docker build + security scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    strategy:
      matrix:
        include:
          - image: api
            context: backend
            target: runtime
          - image: worker
            context: backend
            target: worker
          - image: web
            context: frontend
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push — CD owns publishing)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: streamflix/${{ matrix.image }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: streamflix/${{ matrix.image }}:ci-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0" # report, don't block — flip to "1" once the baseline is clean
          format: table
