name: Terraform

# Phase 5: Terraform + Terragrunt
# DEV environment only.
# Plans run on PRs that touch infrastructure.
# Apply runs manually through workflow_dispatch.

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/terragrunt/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-south-1
  TG_VERSION: "0.67.0"
  TF_VERSION: "1.7.5"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    name: Plan (dev)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TF_VERSION }}"

      - name: Install Terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terragrunt plan - dev
        id: plan
        working-directory: infra/terragrunt/live/dev
        run: |
          terragrunt run-all plan -no-color 2>&1 | tee /tmp/plan-dev.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = fs
              .readFileSync('/tmp/plan-dev.txt', 'utf8')
              .slice(-60000);

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan — dev

            <details>
            <summary>Show plan</summary>

            \`\`\`
            ${body}
            \`\`\`

            </details>`
            });

      - name: Fail if Terraform plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'workflow_dispatch'
    name: Apply (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TF_VERSION }}"

      - name: Install Terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Write CloudFront private key
        run: |
          mkdir -p infra/.secrets
          printf '%s' "${{ secrets.CLOUDFRONT_PRIVATE_KEY_PEM }}" > infra/.secrets/cloudfront-private.pem

      - name: Terragrunt apply - dev
        working-directory: infra/terragrunt/live/dev
        run: |
          terragrunt run-all apply \
            -no-color \
            --terragrunt-non-interactive

      - name: Re-apply IAM cluster
        working-directory: infra/terragrunt/live/dev/iam-cluster
        run: |
          terragrunt apply \
            -no-color \
            --terragrunt-non-interactive

      - name: Re-apply IAM IRSA
        working-directory: infra/terragrunt/live/dev/iam-irsa
        run: |
          terragrunt apply \
            -no-color \
            --terragrunt-non-interactive