name: Terraform

# DEV environment only.
#
# Push to main:
#   -> Terraform Plan
#
# Pull Request:
#   -> Terraform Plan
#
# Manual workflow_dispatch:
#   -> Terraform Apply
#
# Apply is NEVER triggered automatically by push or PR.

on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - "infra/terragrunt/**"

  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/terragrunt/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Prevent concurrent Terraform operations against DEV.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TG_VERSION: "0.67.0"
  TF_VERSION: "1.16.2"


# ============================================================
# TERRAFORM PLAN
# ============================================================

jobs:

  plan:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TF_VERSION }}"


      # --------------------------------------------------------
      # Terragrunt
      # --------------------------------------------------------

      - name: Install Terragrunt
        run: |
          set -euo pipefail

          curl -sL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64"

          chmod +x /usr/local/bin/terragrunt

          terragrunt --version


      # --------------------------------------------------------
      # AWS Authentication
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Verify AWS / Terraform / Terragrunt
      # --------------------------------------------------------

      - name: Verify AWS identity and tool versions
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS Identity"
          echo "========================================"

          aws sts get-caller-identity

          echo ""
          echo "========================================"
          echo "AWS Region"
          echo "========================================"

          echo "AWS_REGION=${AWS_REGION}"
          echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-not-set}"

          echo ""
          echo "========================================"
          echo "Terraform Version"
          echo "========================================"

          terraform version

          echo ""
          echo "========================================"
          echo "Terragrunt Version"
          echo "========================================"

          terragrunt --version


      # --------------------------------------------------------
      # Initialize Terraform / Terragrunt Backend
      # --------------------------------------------------------

      - name: Initialize Terragrunt backend
        working-directory: infra/terragrunt/live/dev
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Initializing Terragrunt backend"
          echo "========================================"

          terragrunt run-all init \
            -reconfigure \
            --terragrunt-non-interactive


      # --------------------------------------------------------
      # Verify Generated Backend Configuration
      # --------------------------------------------------------

      - name: Verify Terragrunt backend configuration
        working-directory: infra/terragrunt/live/dev
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generated Terraform backend configuration"
          echo "========================================"

          find .terragrunt-cache \
            -type f \
            -name backend.tf \
            -print \
            -exec grep -HnE \
              'bucket|key|region|dynamodb_table|use_lockfile' {} \; \
            || true


      # --------------------------------------------------------
      # Verify Terraform State
      # --------------------------------------------------------

      - name: Verify Terraform state access
        working-directory: infra/terragrunt/live/dev
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform State Verification"
          echo "========================================"

          terragrunt run-all state list \
            --terragrunt-non-interactive \
            > /tmp/terraform-state-list.txt 2>&1

          cat /tmp/terraform-state-list.txt


      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terragrunt plan - dev
        id: plan
        working-directory: infra/terragrunt/live/dev
        run: |
          set -o pipefail

          echo "========================================"
          echo "Terraform Plan - DEV"
          echo "========================================"

          terragrunt run-all plan \
            -no-color \
            --terragrunt-non-interactive \
            2>&1 | tee /tmp/plan-dev.txt

        continue-on-error: true


      # --------------------------------------------------------
      # Comment Plan on PR
      # --------------------------------------------------------

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = fs
              .readFileSync('/tmp/plan-dev.txt', 'utf8')
              .slice(-60000);

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan — dev

            <details>
            <summary>Show plan</summary>

            \`\`\`
            ${body}
            \`\`\`

            </details>`
            });


      # --------------------------------------------------------
      # Fail if Terraform Plan Failed
      # --------------------------------------------------------

      - name: Fail if Terraform plan failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Terraform plan failed."
          exit 1


  # ============================================================
  # TERRAFORM APPLY
  # ============================================================

  apply:
    if: github.event_name == 'workflow_dispatch'
    name: Terraform Apply (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TF_VERSION }}"


      # --------------------------------------------------------
      # Terragrunt
      # --------------------------------------------------------

      - name: Install Terragrunt
        run: |
          set -euo pipefail

          curl -sL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64"

          chmod +x /usr/local/bin/terragrunt

          terragrunt --version


      # --------------------------------------------------------
      # AWS Authentication
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Verify AWS / Terraform / Terragrunt
      # --------------------------------------------------------

      - name: Verify AWS identity and tool versions
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS Identity"
          echo "========================================"

          aws sts get-caller-identity

          echo ""
          echo "========================================"
          echo "AWS Region"
          echo "========================================"

          aws configure get region

          echo ""
          echo "========================================"
          echo "Terraform Version"
          echo "========================================"

          terraform version

          echo ""
          echo "========================================"
          echo "Terragrunt Version"
          echo "========================================"

          terragrunt --version


      # --------------------------------------------------------
      # Write CloudFront Private Key
      # --------------------------------------------------------

      - name: Write CloudFront private key
        run: |
          set -euo pipefail

          mkdir -p infra/.secrets

          printf '%s' "${{ secrets.CLOUDFRONT_PRIVATE_KEY_PEM }}" \
            > infra/.secrets/cloudfront-private.pem

          chmod 600 infra/.secrets/cloudfront-private.pem


      # --------------------------------------------------------
      # Initialize Terraform / Terragrunt Backend
      # --------------------------------------------------------

      - name: Initialize Terragrunt backend
        working-directory: infra/terragrunt/live/dev
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Initializing Terragrunt backend"
          echo "========================================"

          terragrunt run-all init \
            -reconfigure \
            --terragrunt-non-interactive


      # --------------------------------------------------------
      # Verify Generated Backend Configuration
      # --------------------------------------------------------

      - name: Verify Terragrunt backend configuration
        working-directory: infra/terragrunt/live/dev
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generated Terraform backend configuration"
          echo "========================================"

          find .terragrunt-cache \
            -type f \
            -name backend.tf \
            -print \
            -exec grep -HnE \
              'bucket|key|region|dynamodb_table|use_lockfile' {} \; \
            || true


      # --------------------------------------------------------
      # Verify Terraform State
      # --------------------------------------------------------

      - name: Verify Terraform state access
        working-directory: infra/terragrunt/live/dev
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform State Verification"
          echo "========================================"

          terragrunt run-all state list \
            --terragrunt-non-interactive \
            > /tmp/terraform-state-list.txt 2>&1

          cat /tmp/terraform-state-list.txt


      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terragrunt apply - dev
        working-directory: infra/terragrunt/live/dev
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Terraform Apply - DEV"
          echo "========================================"

          terragrunt run-all apply \
            -no-color \
            --terragrunt-non-interactive