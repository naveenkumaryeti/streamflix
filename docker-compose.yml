# StreamFlix — full local stack: Postgres, Redis, DynamoDB Local, API, transcode worker, web.
#   cp .env.example .env && docker compose up --build
#   web  http://localhost:3000     api  http://localhost:8080/api/v1
name: streamflix

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamflix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamflix_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-streamflix}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamflix} -d ${POSTGRES_DB:-streamflix}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    working_dir: /home/dynamodblocal
    user: root
    ports: ["8000:8000"]
    volumes: ["dynamodata:/home/dynamodblocal/data"]

  # One-shot: SQL migrations + DynamoDB table + seed data. API waits for it.
  migrate:
    build:
      context: ./backend
      target: runtime
    command: ["node", "src/db/setup.js"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-streamflix}:${POSTGRES_PASSWORD:-streamflix_local_pw}@postgres:5432/${POSTGRES_DB:-streamflix}
      REDIS_URL: redis://redis:6379
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      dynamodb: {condition: service_started}
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    command: ["node", "src/index.js"]
    env_file: [.env]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-streamflix}:${POSTGRES_PASSWORD:-streamflix_local_pw}@postgres:5432/${POSTGRES_DB:-streamflix}
      REDIS_URL: redis://redis:6379
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      LOCAL_STORAGE_DIR: /app/storage
      PUBLIC_MEDIA_BASE_URL: http://localhost:8080/media
    ports: ["8080:8080"]
    volumes: ["media:/app/storage"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Consumes the Redis transcode queue and produces HLS renditions with ffmpeg.
  worker:
    build:
      context: ./backend
      target: worker
    command: ["node", "src/worker/index.js"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-streamflix}:${POSTGRES_PASSWORD:-streamflix_local_pw}@postgres:5432/${POSTGRES_DB:-streamflix}
      REDIS_URL: redis://redis:6379
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      LOCAL_STORAGE_DIR: /app/storage
      # The worker writes poster URLs, so it needs the same public base as the API.
      PUBLIC_MEDIA_BASE_URL: http://localhost:8080/media
      WORKER_PORT: ${WORKER_PORT:-9090}
    # Shares the media volume with the API: the worker writes HLS, the API serves it.
    volumes: ["media:/app/storage"]
    ports: ["9090:9090"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    # A transcode can outlive the default 10s grace period; let it finish or be reaped.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.WORKER_PORT||9090)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-StreamFlix}
    restart: unless-stopped
    ports: ["3000:8080"]
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:
  redisdata:
  dynamodata:
  media:
