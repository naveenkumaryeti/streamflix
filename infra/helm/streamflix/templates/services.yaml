apiVersion: v1
kind: Service
metadata:
  name: streamflix-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "streamflix.selectorLabels" (dict "component" "api" "Values" .Values) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "streamflix.selectorLabels" (dict "component" "api" "Values" .Values) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.api.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: streamflix-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "streamflix.selectorLabels" (dict "component" "worker" "Values" .Values) | nindent 4 }}
spec:
  # Headless — the worker has no HTTP consumers, this only exists so /healthz is reachable
  # for probes and so Prometheus can discover targets for scraping.
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "streamflix.selectorLabels" (dict "component" "worker" "Values" .Values) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.worker.port }}
      targetPort: {{ .Values.worker.port }}
